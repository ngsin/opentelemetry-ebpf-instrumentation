version: "3.8"

services:
  # Redis server for cpphttpsvc to connect to
  redis:
    build:
      context: components/redis/
      dockerfile: Dockerfile
    image: redis

  # cpphttpsvc is a C++ HTTP server built with cpp-httplib + hiredis.
  # OBI instruments it via GOT hooking (accept4/recv/send) for HTTP server spans.
  # The /redis-ping endpoint performs Redis SET + GET via hiredis, which eBPF
  # detects via kprobe on tcp_recvmsg as Redis RESP protocol.
  cpphttpsvc:
    build:
      context: components/cpphttpsvc
      dockerfile: Dockerfile
    image: hatest-cpphttpsvc
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_started

  # cpphttpssvc is the same binary in HTTPS mode (cpp-httplib + OpenSSL + hiredis).
  # OBI instruments it via GOT hooking (SSL_read/SSL_write) for HTTPS server spans.
  # Uses a distinct binary name so OBI assigns a separate service name.
  cpphttpssvc:
    build:
      context: components/cpphttpsvc
      dockerfile: Dockerfile
    image: hatest-cpphttpsvc
    ports:
      - "8443:8443"
    entrypoint: ["/app/cpphttpssvc"]
    command: ["8443", "--tls", "/app/certs/cert.pem", "/app/certs/key.pem"]
    # CAP_BPF + bpffs mount required so the injected C++ agent can open
    # BPF pinned maps (traces_ctx_v1, incoming_trace_map) for HTTPS
    # traceparent propagation.
    cap_add:
      - SYS_ADMIN
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf:ro
    depends_on:
      redis:
        condition: service_started

  # cppsvc is a C application using libcurl to make periodic HTTP requests.
  # Requests go to cpphttpsvc /redis-ping which triggers Redis operations.
  cppsvc:
    build:
      context: components/cppsvc
      dockerfile: Dockerfile
    image: hatest-cppsvc
    command: ["http://cpphttpsvc:8080/redis-ping", "2", "200"]
    depends_on:
      cpphttpsvc:
        condition: service_started

  # cppsvctls is the same curl client in HTTPS mode.
  # Requests go to cpphttpssvc /redis-ping over TLS which triggers Redis operations.
  # Uses a distinct binary name so OBI assigns a separate service name.
  cppsvctls:
    build:
      context: components/cppsvc
      dockerfile: Dockerfile
    image: hatest-cppsvc
    entrypoint: ["/app/cppsvctls"]
    command: ["https://cpphttpssvc:8443/redis-ping", "2", "200"]
    # CAP_BPF + bpffs mount required so the injected C++ agent can open
    # BPF pinned maps (traces_ctx_v1) for HTTPS traceparent header injection.
    cap_add:
      - SYS_ADMIN
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf:ro
    depends_on:
      cpphttpssvc:
        condition: service_started

  obi:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile
    command:
      - --config=/configs/obi-config-cpp-redis.yml
    volumes:
      - ./configs/:/configs
      - ./system/sys/kernel/security:/sys/kernel/security
      - /sys/fs/cgroup/unified:/sys/fs/cgroup/unified
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-cpp-redis:/var/run/obi
      - /sys/fs/bpf:/sys/fs/bpf
    image: hatest-cppredisobi
    privileged: true
    pid: "host"
    environment:
      GOCOVERDIR: "/coverage"
      OTEL_EBPF_TRACE_PRINTER: "text"
      OTEL_EBPF_EXECUTABLE_PATH: "(cppsvc|cppsvctls|cpphttpsvc|cpphttpssvc)"
      OTEL_EBPF_SERVICE_NAMESPACE: "integration-test"
      OTEL_EBPF_METRICS_INTERVAL: "10ms"
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: "1ms"
      OTEL_EBPF_BPF_BATCH_TIMEOUT: "10ms"
      OTEL_EBPF_LOG_LEVEL: "DEBUG"
      OTEL_EBPF_BPF_DEBUG: "TRUE"
      OTEL_EBPF_HOSTNAME: "beyla"
      OTEL_EBPF_CPP_ENABLED: "true"
      OTEL_EBPF_CPP_DEBUG: "true"
      OTEL_EBPF_DISCOVERY_POLL_INTERVAL: 500ms
      OTEL_EBPF_PROCESSES_INTERVAL: "100ms"
      OTEL_EBPF_INTERNAL_METRICS_PROMETHEUS_PORT: 8999
      OTEL_EBPF_BPF_HTTP_REQUEST_TIMEOUT: "5s"
    depends_on:
      cppsvc:
        condition: service_started
      cpphttpsvc:
        condition: service_started
      cppsvctls:
        condition: service_started
      cpphttpssvc:
        condition: service_started

  # OpenTelemetry Collector for Metrics and Traces fanout
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.147.0@sha256:e7c92c715f28ff142f3bcaccd4fc5603cf4c71276ef09954a38eb4038500a5a5
    container_name: otel-col
    deploy:
      resources:
        limits:
          memory: 125M
    restart: unless-stopped
    command: ["--config=/etc/otelcol-config/otelcol-config.yml"]
    volumes:
      - ./configs/:/etc/otelcol-config
    ports:
      - "4317" # OTLP over gRPC receiver
      - "4318" # OTLP over HTTP receiver
      - "9464" # Prometheus exporter
      - "8888" # metrics endpoint
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started

  # Prometheus
  prometheus:
    image: quay.io/prometheus/prometheus:v3.10.0@sha256:7571a304e67fbd794be02422b13627dc7de822152f74e99e2bef95d29eceecde
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus-config.yml
      - --web.enable-lifecycle
      - --web.route-prefix=/
    volumes:
      - ./configs/:/etc/prometheus
    ports:
      - "9090:9090"

  jaeger:
    image: jaegertracing/all-in-one:1.60@sha256:4fd2d70fa347d6a47e79fcb06b1c177e6079f92cba88b083153d56263082135e
    ports:
      - "16686:16686" # Query frontend
      - "4317" # OTEL GRPC traces collector
      - "4318" # OTEL HTTP traces collector
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=debug

networks:
  default:
    ipam:
      config:
        - subnet: 10.200.0.0/16
